<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ClassViewで学校全体の日別・週間時間割を確認できます。">
    <title>時間割 | ClassView</title>
    <link
      rel="stylesheet"
      href="css/style.css?v=20260825T0626236729072Z"
      data-site-stylesheet
      data-site-href="css/style.css"
    >
    <script src="js/site-loader.js?v=1" defer></script>
    <script data-site-src="js/timetable.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">本文へ移動</a>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-name" href="index.html" aria-label="ClassView 時間割">ClassView</a>
        <nav class="site-navigation" aria-label="メインナビゲーション">
          <a class="site-navigation__link" href="index.html" aria-current="page">時間割</a>
          <a class="site-navigation__link" href="courses.html">授業を探す</a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="page-shell timetable-page">
      <header class="timetable-header">
        <p class="page-eyebrow">School timetable</p>
        <h1>時間割</h1>
        <p>
          学校全体の授業を日別・週別に確認できます。同じ時限に行われる授業はすべて表示します。
        </p>
      </header>

      <section class="timetable-toolbar" aria-label="時間割の表示設定">
        <div class="timetable-view-switch" role="group" aria-label="表示方法">
          <button id="day-view-button" class="timetable-switch-button" type="button" aria-pressed="true">
            日表示
          </button>
          <button id="week-view-button" class="timetable-switch-button" type="button" aria-pressed="false">
            週間表示
          </button>
        </div>
        <div class="timetable-date-navigation" role="group" aria-label="表示する日付の移動">
          <button id="previous-date-button" class="timetable-navigation-button" type="button">← 前の日</button>
          <button id="today-button" class="timetable-navigation-button" type="button">今日</button>
          <button id="next-date-button" class="timetable-navigation-button" type="button">次の日 →</button>
        </div>
      </section>

      <section class="timetable-results" aria-labelledby="timetable-date-heading">
        <h2 id="timetable-date-heading" class="timetable-date-heading">時間割を読み込んでいます…</h2>
        <div id="timetable-content" class="timetable-content" aria-live="polite" aria-busy="true">
          <p class="loading">時間割を読み込んでいます…</p>
        </div>
      </section>

      <aside class="timetable-notice" aria-label="時間割について">
        <p>最新の変更については、学校からの案内も確認してください。</p>
        <p id="timetable-updated-at" class="timetable-updated-at" hidden></p>
      </aside>
    </main>

    <footer class="site-footer">
      <p>ClassView — 授業選択のための情報サイト</p>
    </footer>
  </body>
</html>
