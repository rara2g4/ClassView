<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>時間割 UI Lab | ClassView</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#lab-stage">比較画面へ移動</a>
  <header class="lab-header" id="lab-header">
    <div class="lab-header__brand">
      <span class="lab-header__eyebrow">CLASSVIEW / UI LAB</span>
      <h1>時間割の見せ方を比較する</h1>
      <p>同じデモデータを、構造の異なる8案で操作できます。</p>
    </div>
    <div class="lab-header__actions">
      <button id="comparison-toggle" class="lab-button lab-button--secondary" type="button" aria-pressed="false">
        8案を一覧比較
      </button>
    </div>
  </header>

  <nav class="concept-nav" aria-label="時間割UI案">
    <div id="concept-tabs" class="concept-nav__list" role="tablist"></div>
  </nav>

  <section class="concept-intro" aria-live="polite">
    <div>
      <span id="concept-kicker" class="concept-intro__kicker"></span>
      <h2 id="concept-title"></h2>
      <p id="concept-description"></p>
    </div>
    <dl class="concept-intro__facts">
      <div><dt>強み</dt><dd id="concept-strength"></dd></div>
      <div><dt>注意点</dt><dd id="concept-risk"></dd></div>
    </dl>
  </section>

  <section class="lab-controls" aria-label="表示条件">
    <div class="segmented" aria-label="時間割の対象">
      <button id="mode-school" type="button" aria-pressed="true">学校全体</button>
      <button id="mode-personal" type="button" aria-pressed="false">自分の時間割</button>
    </div>
    <div class="segmented" aria-label="表示方法">
      <button id="view-day" type="button" aria-pressed="false">日表示</button>
      <button id="view-week" type="button" aria-pressed="true">週間表示</button>
    </div>
    <div class="date-controls" aria-label="日付の移動">
      <button id="date-previous" type="button" aria-label="前へ">←</button>
      <button id="date-reset" type="button">11月2日の週</button>
      <button id="date-next" type="button" aria-label="次へ">→</button>
    </div>
  </section>

  <div id="prototype-status" class="prototype-status" role="status" aria-live="polite"></div>
  <main id="lab-stage" class="lab-stage" tabindex="-1">
    <div class="loading-state">デモ時間割を読み込んでいます…</div>
  </main>

  <section id="comparison-panel" class="comparison-panel" hidden aria-labelledby="comparison-heading">
    <div class="comparison-panel__heading">
      <div>
        <span class="concept-intro__kicker">SAME DATA / SAME VIEW</span>
        <h2 id="comparison-heading">8案を同じ条件で俯瞰する</h2>
      </div>
      <p>各フレームは操作できます。詳細な比較は上のタブで1案ずつ確認してください。</p>
    </div>
    <div id="comparison-grid" class="comparison-grid"></div>
  </section>

  <footer class="lab-footer">
    <p>比較専用プロトタイプです。本番の時間割・履修設定・保存データは変更しません。</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
