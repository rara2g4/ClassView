name: Public site

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install 'jsonschema>=4.21,<5' playwright
          python -m playwright install --with-deps chromium
      - name: Check JavaScript and public data contracts
        run: |
          git ls-files -z '*.js' | xargs -0 -n 1 node --check
          for suite in tools/course-importer/tests/test_*.js; do node "$suite"; done
          python -m unittest discover -s tools/course-importer/tests -p test_data_contract.py
      - name: Exercise desktop and mobile layouts in Chromium
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/classview-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/index.html --output /dev/null
          python tools/course-importer/tests/browser_display_preferences.py http://127.0.0.1:8000/
