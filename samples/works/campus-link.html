<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Campus Link | 架空制作物サンプル</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="demo-header"><div class="shell demo-header__inner"><p class="demo-brand">ClassView Sample Works</p><a href="../../course.html?id=group-project">グループ制作へ戻る</a></div></header>
    <main class="shell demo-main">
      <p class="demo-label">Team project</p>
      <h1>Campus Link</h1>
      <p class="demo-lead">校内イベントの発見、参加、運営をひとつにつなぐことを目標に、チームで企画・設計したWebサービスです。</p>
      <p class="demo-notice">これは制作物表示の確認用に作成した架空のサンプルです。人物や団体は実在しません。</p>
      <figure class="demo-visual"><img src="../../assets/works/group-project/no-year/f58d0140a70544159926979e999d9a37.png" alt="イベント一覧、参加状況、予定をまとめたCampus Linkの画面"></figure>
      <div class="demo-grid">
        <section class="demo-section"><h2>企画</h2><p>利用者への聞き取りを想定し、必要な情報と操作を整理しました。</p></section>
        <section class="demo-section"><h2>分担</h2><p>画面設計、データ設計、実装、発表準備を役割分担しました。</p></section>
        <section class="demo-section"><h2>改善</h2><p>レビュー結果を共有し、優先順位を決めて更新しました。</p></section>
      </div>
    </main>
    <footer class="demo-footer"><div class="shell">ClassView 架空制作物サンプル</div></footer>
