<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>光の遺跡 | 架空制作物サンプル</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="demo-header">
      <div class="shell demo-header__inner">
        <p class="demo-brand">ClassView Sample Works</p>
        <a href="../../course.html?id=game-development">ゲーム制作へ戻る</a>
      </div>
    </header>
    <main class="shell demo-main">
      <p class="demo-label">Game prototype</p>
      <h1>光の遺跡</h1>
      <p class="demo-lead">光の向きを切り替えて遺跡を進む、2Dパズルゲームの企画・画面デザイン・試作をまとめた制作例です。</p>
      <p class="demo-notice">これは制作物表示の確認用に作成した架空のサンプルです。実在する学生作品ではありません。</p>
      <figure class="demo-visual">
        <img src="../../assets/works/game-development/no-year/a3d807be14cf4a24b65019cbf788b9ed.png" alt="光の反射装置を操作して遺跡を進む2Dパズルゲーム画面">
      </figure>
      <div class="demo-grid">
        <section class="demo-section"><h2>担当範囲</h2><p>企画、ステージ設計、キャラクター操作、演出調整</p></section>
        <section class="demo-section"><h2>工夫した点</h2><p>光の経路が一目で分かる色と、試行錯誤しやすい配置を検討しました。</p></section>
        <section class="demo-section"><h2>使用技術</h2><p>ゲームエンジン、2D画像編集、バージョン管理</p></section>
      </div>
    </main>
    <footer class="demo-footer"><div class="shell">ClassView 架空制作物サンプル</div></footer>
  </body>
</html>
