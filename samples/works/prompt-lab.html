<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Prompt Lab | 架空制作物サンプル</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="demo-header"><div class="shell demo-header__inner"><p class="demo-brand">ClassView Sample Works</p><a href="../../course.html?id=ai-practice">AI活用演習へ戻る</a></div></header>
    <main class="shell demo-main">
      <p class="demo-label">AI practice tool</p>
      <h1>Prompt Lab</h1>
      <p class="demo-lead">指示文の違いによる回答の変化を並べて比較し、正確さや分かりやすさを記録する学習支援ツールです。</p>
      <p class="demo-notice">これは制作物表示の確認用に作成した架空のサンプルです。実在するAIサービスではありません。</p>
      <figure class="demo-visual"><img src="../../assets/works/ai-practice/no-year/e4413f7c6a654581bcd748a3269ec845.png" alt="指示文、2つの回答、評価項目を並べたPrompt Labの画面"></figure>
      <div class="demo-grid">
        <section class="demo-section"><h2>比較</h2><p>2種類の指示文と回答を同じ画面で確認します。</p></section>
        <section class="demo-section"><h2>評価</h2><p>正確さ、明瞭さ、情報の不足を観点別に記録します。</p></section>
        <section class="demo-section"><h2>振り返り</h2><p>結果と改善案を履歴として残し、次の指示文へ生かします。</p></section>
      </div>
    </main>
    <footer class="demo-footer"><div class="shell">ClassView 架空制作物サンプル</div></footer>
  </body>
</html>
